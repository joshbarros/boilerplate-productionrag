services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8800:8800"
      - "8801:8801"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ragcore
      POSTGRES_PASSWORD: ragcore
      POSTGRES_DB: ragcore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragcore"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
