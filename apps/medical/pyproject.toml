[project]
name = "production-rag-medical"
version = "0.1.0"
description = "Medical niche for production-rag — PubMed Central literature Q&A"
requires-python = ">=3.12"
dependencies = [
  "production-rag-core",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
production-rag-core = { path = "../../packages/core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical"]
