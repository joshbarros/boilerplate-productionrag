[project]
name = "production-rag-core"
version = "0.1.0"
description = "Self-hosted, citation-grounded document QA engine — shared by all niche apps"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "fastmcp>=0.1.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.0",
  "qdrant-client>=1.12.0",
  "anthropic>=0.40.0",
  "openai>=1.50.0",
  "ollama>=0.3.0",
  "sentence-transformers>=3.0.0",
  "docling>=2.0.0",
  "pymupdf>=1.24.0",
  "slowapi>=0.1.9",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp>=1.28.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcore"]
